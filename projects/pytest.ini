[pytest]
# Register custom markers
markers =
    integration: Integration tests that may make real network calls
    slow: Tests that take significant time to run
    unit: Fast isolated unit tests
    
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    
# Test paths
testpaths = projects/auto_page/autopageMKII/tests